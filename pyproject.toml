[project]
name = "pyrodgers"
version = "0.1.0"
description = "Inverse modelling methods for atmospheric sounding. Based on Rodgers (2000)"
readme = "README.md"
authors = [
    { name = "Mees Franssen", email = "mees.franssen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
pyrodgers = "pyrodgers:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
